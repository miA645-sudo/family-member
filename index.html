<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Members Vocab Challenge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    body { background: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/80 rounded-3xl p-6 shadow-2xl backdrop-blur">
    
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-500/20 text-indigo-400 rounded-2xl mb-3 text-2xl border border-indigo-500/30">
        <i class="fa-solid fa-users"></i>
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">Family Members Challenge</h1>
      <p class="text-xs text-slate-400 mt-1">Type as many family words as you can in 3 minutes!</p>
    </div>

    <!-- Step 1: Name -->
    <div id="joinStep" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Your Name / Nickname</label>
        <input id="studentNameInput" type="text" placeholder="e.g. Alex, Linh..." 
               class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm">
      </div>
      <button id="startBtn" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 transition text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
        <i class="fa-solid fa-play text-xs"></i> Start 3-Minute Timer
      </button>
    </div>

    <!-- Step 2: Quiz -->
    <div id="quizStep" class="hidden space-y-4">
      <div class="flex items-center justify-between bg-slate-900/80 px-4 py-2.5 rounded-2xl border border-slate-700">
        <div class="flex items-center gap-2">
          <i class="fa-regular fa-clock text-indigo-400"></i>
          <span class="text-xs font-semibold uppercase text-slate-400 tracking-wider">Time Left</span>
        </div>
        <span id="timerDisplay" class="font-mono text-xl font-bold text-emerald-400">03:00</span>
      </div>

      <div class="flex gap-2">
        <input id="wordInput" type="text" placeholder="e.g. father, cousin..." 
               class="flex-1 px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 text-sm" autocomplete="off">
        <button id="addWordBtn" class="px-5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold active:scale-95 transition">
          Add
        </button>
      </div>

      <div class="bg-slate-900/60 border border-slate-700/60 rounded-2xl p-3 min-h-[140px] max-h-[220px] overflow-y-auto">
        <div class="flex justify-between items-center mb-2 px-1">
          <span class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">Your Words</span>
          <span id="wordCountBadge" class="text-xs font-bold px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded-full">0 words</span>
        </div>
        <div id="wordTags" class="flex flex-wrap gap-1.5">
          <p id="emptyPrompt" class="text-xs text-slate-500 italic p-2">Type a word and press Enter!</p>
        </div>
      </div>

      <button id="submitBtn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-white font-semibold rounded-xl shadow-lg shadow-emerald-600/30 flex items-center justify-center gap-2">
        <i class="fa-solid fa-paper-plane text-xs"></i> Submit Answers Now
      </button>
    </div>

    <!-- Step 3: Finished -->
    <div id="doneStep" class="hidden text-center py-6 space-y-4">
      <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center text-3xl mx-auto border border-emerald-500/30">
        <i class="fa-solid fa-check"></i>
      </div>
      <div>
        <h2 class="text-xl font-bold text-white">Awesome Job!</h2>
        <p class="text-sm text-slate-400 mt-1">Your words have been submitted.</p>
        <p class="text-xs text-indigo-400 mt-3 font-medium">Look up at the projector to see the class results! 🚀</p>
      </div>
    </div>

  </div>

  <script>
   const firebaseConfig = {
  apiKey: "AIzaSyCt4YQ6gS3WypFBWVOcpNrSQDDNvi_JEuY",
  authDomain: "a22u20vocab.firebaseapp.com",
  databaseURL: "https://a22u20vocab-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "a22u20vocab",
  storageBucket: "a22u20vocab.firebasestorage.app",
  messagingSenderId: "768340895051",
  appId: "1:768340895051:web:411bafc67e5946fc71b4ce",
  measurementId: "G-6MKY4M04RE"
};
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let timer = 180;
    let timerInterval = null;
    let studentName = "";
    const words = new Set();

    const joinStep = document.getElementById('joinStep');
    const quizStep = document.getElementById('quizStep');
    const doneStep = document.getElementById('doneStep');
    const studentNameInput = document.getElementById('studentNameInput');
    const startBtn = document.getElementById('startBtn');
    const wordInput = document.getElementById('wordInput');
    const addWordBtn = document.getElementById('addWordBtn');
    const wordTags = document.getElementById('wordTags');
    const wordCountBadge = document.getElementById('wordCountBadge');
    const timerDisplay = document.getElementById('timerDisplay');
    const submitBtn = document.getElementById('submitBtn');
    const emptyPrompt = document.getElementById('emptyPrompt');

    startBtn.onclick = () => {
      studentName = studentNameInput.value.trim();
      if (!studentName) {
        alert("Please enter your name first!");
        return;
      }
      joinStep.classList.add('hidden');
      quizStep.classList.remove('hidden');
      wordInput.focus();
      startTimer();
    };

    function startTimer() {
      timerInterval = setInterval(() => {
        timer--;
        const mins = String(Math.floor(timer / 60)).padStart(2, '0');
        const secs = String(timer % 60).padStart(2, '0');
        timerDisplay.textContent = `${mins}:${secs}`;

        if (timer <= 30) {
          timerDisplay.classList.remove('text-emerald-400');
          timerDisplay.classList.add('text-rose-400', 'animate-pulse');
        }

        if (timer <= 0) {
          clearInterval(timerInterval);
          finishQuiz();
        }
      }, 1000);
    }

    function addWord() {
      const val = wordInput.value.trim().toLowerCase();
      if (!val) return;
      if (!words.has(val)) {
        words.add(val);
        renderTags();
      }
      wordInput.value = "";
      wordInput.focus();
    }

    addWordBtn.onclick = addWord;
    wordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        addWord();
      }
    });

    function renderTags() {
      if (words.size > 0 && emptyPrompt) emptyPrompt.style.display = 'none';
      wordTags.innerHTML = "";
      words.forEach(w => {
        const badge = document.createElement('span');
        badge.className = "inline-flex items-center gap-1.5 px-3 py-1 bg-slate-800 text-indigo-300 border border-slate-700 rounded-xl text-xs font-medium";
        badge.innerHTML = `<span>${w}</span> <button class="hover:text-rose-400 text-slate-500">×</button>`;
        badge.querySelector('button').onclick = () => {
          words.delete(w);
          renderTags();
        };
        wordTags.appendChild(badge);
      });
      wordCountBadge.textContent = `${words.size} word${words.size === 1 ? '' : 's'}`;
    }

    function finishQuiz() {
      clearInterval(timerInterval);
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      // Đẩy dữ liệu lên Firebase Realtime Database
      db.ref('submissions').push({
        name: studentName,
        words: Array.from(words),
        timestamp: Date.now()
      }).then(() => {
        quizStep.classList.add('hidden');
        doneStep.classList.remove('hidden');
      }).catch(err => {
        alert("Submission failed. Please check internet connection.");
        submitBtn.disabled = false;
      });
    }

    submitBtn.onclick = finishQuiz;
  </script>
</body>
</html>
